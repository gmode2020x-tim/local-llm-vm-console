services:
  llm-ui:
    build: .
    container_name: local-llm-ui
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LLM_UI_DATA_DIR: /data
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://ollama:11434/v1}
      HOST_WORKER_STATUS_URL: ${HOST_WORKER_STATUS_URL:-}
    ports:
      - "8068:8068"
    volumes:
      - ./runtime/ui-data:/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: local-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./runtime/ollama:/root/.ollama
    # For NVIDIA GPU acceleration on Linux hosts with NVIDIA Container Toolkit:
    # gpus: all

  caddy:
    image: caddy:2
    container_name: local-llm-caddy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/linux/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - llm-ui
